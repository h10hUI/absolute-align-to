<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* src/ui/styles/base.css */
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          sans-serif;
        font-size: 11px;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #ffffff);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
      }

      /* src/ui/styles/layer-list.css */
      ul#layers {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 220px;
        overflow-y: auto;
      }
      ul#layers li label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      ul#layers li label:hover {
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }
      ul#layers input[type=radio] {
        margin: 0;
      }
      ul#layers .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* src/ui/styles/badge.css */
      .badge {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 999px;
        background: var(--figma-color-bg-brand, #0d99ff);
        color: var(--figma-color-text-onbrand, #ffffff);
      }
      .badge.warn {
        background: var(--figma-color-bg-warning, #ffcd29);
        color: var(--figma-color-text-warning, #1e1e1e);
      }

      /* src/ui/styles/toggle.css */
      #close-after {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        cursor: pointer;
        user-select: none;
      }
      #close-after #close-after-input {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        flex: none;
        width: 28px;
        height: 16px;
        margin: 0;
        border-radius: 999px;
        background: var(--figma-color-bg-disabled, #dcdcdc);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      #close-after #close-after-input::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--figma-color-bg, #ffffff);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s ease;
      }
      #close-after #close-after-input:checked {
        background: var(--figma-color-bg-brand, #0d99ff);
      }
      #close-after #close-after-input:checked::after {
        transform: translateX(12px);
      }
      #close-after #close-after-input:focus-visible {
        outline: 2px solid var(--figma-color-border-brand, #0d99ff);
        outline-offset: 2px;
      }

      /* src/ui/styles/align-buttons.css */
      #directions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      #directions button {
        padding: 6px 4px;
        font-size: 10px;
        border: 1px solid var(--figma-color-border, #dcdcdc);
        background: var(--figma-color-bg, #ffffff);
        color: var(--figma-color-text, #1e1e1e);
        border-radius: 4px;
        cursor: pointer;
      }
      #directions button:hover:not(:disabled) {
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }
      #directions button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* src/ui/styles/distribute.css */
      #space {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #space button {
        padding: 6px 4px;
        font-size: 10px;
        border: 1px solid var(--figma-color-border, #dcdcdc);
        background: var(--figma-color-bg, #ffffff);
        color: var(--figma-color-text, #1e1e1e);
        border-radius: 4px;
        cursor: pointer;
      }
      #space button:hover:not(:disabled) {
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }
      #space button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #space #spacing-input {
        width: 56px;
        margin-left: 4px;
        padding: 5px 4px;
        font-size: 10px;
        font-family: inherit;
        border: 1px solid var(--figma-color-border, #dcdcdc);
        border-radius: 4px;
        background: var(--figma-color-bg, #ffffff);
        color: var(--figma-color-text, #1e1e1e);
      }
      #space #spacing-input:focus {
        border-color: var(--figma-color-border-brand, #0d99ff);
        outline: 1px solid var(--figma-color-border-brand, #0d99ff);
        outline-offset: -1px;
      }
      #space #spacing-input:disabled {
        opacity: 0.4;
      }
      #space .unit {
        font-size: 10px;
        color: var(--figma-color-text-secondary, #666);
      }
      #distribute-hint {
        font-size: 10px;
        color: var(--figma-color-text-secondary, #666);
      }
      #spacing-error {
        font-size: 10px;
        color: var(--figma-color-text-danger, #c00);
      }

      /* src/ui/styles/messages.css */
      #empty,
      #prompt {
        font-size: 10px;
        padding: 6px 8px;
        border-radius: 4px;
      }
      #empty {
        color: var(--figma-color-text-secondary, #666);
        text-align: center;
        padding: 12px 8px;
      }
      #prompt {
        color: var(--figma-color-text-secondary, #666);
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }
      #status {
        font-size: 10px;
        color: var(--figma-color-text-success, #14ae5c);
      }
      #warning {
        font-size: 10px;
        padding: 6px 8px;
        border-radius: 4px;
        background: var(--figma-color-bg-warning, #fff1c2);
        color: var(--figma-color-text-warning, #6e5b00);
      }

      /* src/ui/styles/close-button.css */
      #close {
        align-self: flex-end;
        font-size: 10px;
        padding: 4px 8px;
        border: none;
        background: transparent;
        color: var(--figma-color-text-secondary, #666);
        cursor: pointer;
      }
      #close:hover {
        color: var(--figma-color-text, #1e1e1e);
      }

      /* src/ui/styles/utilities.css */
      [hidden] {
        display: none !important;
      }

      /* src/ui/styles/index.css */
    </style>
  </head>
  <body>
    <h2>Selected layers (<span id="count">0</span>)</h2>
    <ul id="layers"></ul>
    <section id="empty">Select 2 or more layers to align.</section>
    <section id="prompt" hidden>
      Choose a key object: the layer the others align to.
    </section>
    <label id="close-after">
      <input type="checkbox" id="close-after-input" role="switch" checked />
      Close after aligning
    </label>
    <section id="directions">
      <button type="button" data-direction="left">Left</button>
      <button type="button" data-direction="centerH">Center H</button>
      <button type="button" data-direction="right">Right</button>
      <button type="button" data-direction="top">Top</button>
      <button type="button" data-direction="centerV">Center V</button>
      <button type="button" data-direction="bottom">Bottom</button>
    </section>
    <section id="space">
      <button type="button" data-axis="horizontal">Space H</button>
      <button type="button" data-axis="vertical">Space V</button>
      <input
        type="text"
        id="spacing-input"
        inputmode="decimal"
        autocomplete="off"
        aria-label="Spacing in px (empty = automatic)"
        title="Spacing in px (empty = automatic)"
      />
      <span class="unit">px</span>
    </section>
    <section id="distribute-hint" hidden></section>
    <section id="spacing-error" hidden></section>
    <section id="status" hidden></section>
    <section id="warning" hidden></section>
    <button id="close" type="button">Close</button>

    <script>
      "use strict";
      (() => {
        // src/messages.ts
        var isRecord = (value) => typeof value === "object" && value !== null;

        // src/ui/main.ts
        var state = {
          keyObjectId: null,
          layers: [],
          autoLayoutIds: [],
          nonMovableIds: [],
          sameParent: false
        };
        var byId = (id, ctor) => {
          const element = document.getElementById(id);
          if (!(element instanceof ctor)) {
            throw new Error(`#${id} is missing or has an unexpected element type`);
          }
          return element;
        };
        var countEl = byId("count", HTMLElement);
        var layersEl = byId("layers", HTMLElement);
        var emptyEl = byId("empty", HTMLElement);
        var promptEl = byId("prompt", HTMLElement);
        var statusEl = byId("status", HTMLElement);
        var warningEl = byId("warning", HTMLElement);
        var closeEl = byId("close", HTMLButtonElement);
        var closeAfterEl = byId("close-after-input", HTMLInputElement);
        var directionButtons = document.querySelectorAll("#directions button");
        var distributeButtons = document.querySelectorAll("#space button");
        var spacingEl = byId("spacing-input", HTMLInputElement);
        var distributeHintEl = byId("distribute-hint", HTMLElement);
        var spacingErrorEl = byId("spacing-error", HTMLElement);
        var postToMain = (message) => {
          parent.postMessage({ pluginMessage: message }, "*");
        };
        var setStatus = (text) => {
          statusEl.textContent = text;
          statusEl.hidden = !text;
        };
        var setWarning = (text) => {
          warningEl.textContent = text;
          warningEl.hidden = !text;
        };
        var setSpacingError = (text) => {
          spacingErrorEl.textContent = text;
          spacingErrorEl.hidden = !text;
        };
        var createBadge = (text, warn) => {
          const badge = document.createElement("span");
          badge.className = warn ? "badge warn" : "badge";
          badge.textContent = text;
          return badge;
        };
        var render = () => {
          const previousScrollTop = layersEl.scrollTop;
          const listHadFocus = layersEl.contains(document.activeElement);
          countEl.textContent = String(state.layers.length);
          layersEl.replaceChildren();
          for (const layer of state.layers) {
            const li = document.createElement("li");
            const label = document.createElement("label");
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "keyObject";
            radio.value = layer.id;
            radio.checked = layer.id === state.keyObjectId;
            radio.addEventListener("change", () => {
              if (state.keyObjectId === layer.id) return;
              state.keyObjectId = layer.id;
              setStatus("");
              setWarning("");
              render();
            });
            const name = document.createElement("span");
            name.className = "name";
            name.textContent = layer.name;
            label.appendChild(radio);
            label.appendChild(name);
            if (layer.id === state.keyObjectId) {
              label.appendChild(createBadge("Key object", false));
            }
            if (state.autoLayoutIds.includes(layer.id)) {
              label.appendChild(createBadge("Auto Layout", true));
            }
            if (state.nonMovableIds.includes(layer.id) && layer.id !== state.keyObjectId) {
              label.appendChild(createBadge("Not movable", true));
            }
            li.appendChild(label);
            layersEl.appendChild(li);
          }
          const canAlign = state.layers.length >= 2 && state.keyObjectId !== null;
          for (const button of directionButtons) {
            button.disabled = !canAlign;
          }
          const distributeBlockers = [];
          if (state.layers.length > 0) {
            if (state.layers.length < 3) {
              distributeBlockers.push("Select 3 or more layers.");
            }
            if (state.keyObjectId === null) {
              distributeBlockers.push("Choose a key object.");
            }
            if (!state.sameParent) {
              distributeBlockers.push("All selected layers must share the same parent.");
            }
            if (state.autoLayoutIds.length > 0) {
              distributeBlockers.push("Auto Layout children are not supported.");
            }
          }
          const canDistribute = state.layers.length > 0 && distributeBlockers.length === 0;
          for (const button of distributeButtons) {
            button.disabled = !canDistribute;
          }
          spacingEl.disabled = !canDistribute;
          distributeHintEl.textContent = distributeBlockers.join(" ");
          distributeHintEl.hidden = distributeBlockers.length === 0;
          if (!canDistribute) setSpacingError("");
          emptyEl.hidden = state.layers.length >= 2;
          promptEl.hidden = !(state.layers.length >= 2 && state.keyObjectId === null);
          layersEl.scrollTop = previousScrollTop;
          if (listHadFocus) {
            const checked = layersEl.querySelector(
              'input[name="keyObject"]:checked'
            );
            if (checked) checked.focus();
          }
        };
        for (const button of directionButtons) {
          button.addEventListener("click", () => {
            if (!state.keyObjectId) return;
            postToMain({
              type: "align",
              keyObjectId: state.keyObjectId,
              direction: button.dataset.direction,
              closeAfter: closeAfterEl.checked
            });
          });
        }
        var parseSpacing = () => {
          const raw = spacingEl.value.trim();
          if (raw === "") return { spacing: null };
          if (!/^\d+(\.\d+)?$/.test(raw)) return null;
          return { spacing: Number(raw) };
        };
        for (const button of distributeButtons) {
          button.addEventListener("click", () => {
            if (!state.keyObjectId) return;
            const parsed = parseSpacing();
            if (!parsed) {
              setSpacingError("Enter a number of px, or leave the field empty.");
              return;
            }
            setSpacingError("");
            postToMain({
              type: "distribute",
              axis: button.dataset.axis,
              keyObjectId: state.keyObjectId,
              spacing: parsed.spacing,
              closeAfter: closeAfterEl.checked
            });
          });
        }
        spacingEl.addEventListener("input", () => {
          setSpacingError("");
        });
        var renderResult = (message, doneText, alreadyText, warningIsRejection) => {
          const { moved, skipped } = message;
          const warning = message.warning ?? "";
          const rejected = warningIsRejection && moved === 0 && skipped.length === 0 && warning !== "";
          if (moved > 0) {
            setStatus(doneText(moved));
          } else if (skipped.length === 0 && !rejected) {
            setStatus(alreadyText);
          } else {
            setStatus("");
          }
          const parts = [];
          if (skipped.length > 0) {
            const reasons = skipped.map((item) => item.reason).join(" / ");
            parts.push(`Skipped ${skipped.length} layer(s): ${reasons}`);
          }
          if (warning) parts.push(warning);
          setWarning(parts.join(" / "));
        };
        closeEl.addEventListener("click", () => {
          postToMain({ type: "close" });
        });
        var toStringArray = (value) => Array.isArray(value) ? value.filter((item) => typeof item === "string") : [];
        var toLayers = (value) => {
          const layers = [];
          if (!Array.isArray(value)) return layers;
          for (const item of value) {
            if (isRecord(item) && typeof item.id === "string") {
              layers.push({
                id: item.id,
                name: typeof item.name === "string" ? item.name : ""
              });
            }
          }
          return layers;
        };
        var toSkipped = (value) => {
          const skipped = [];
          if (!Array.isArray(value)) return skipped;
          for (const item of value) {
            if (isRecord(item)) {
              skipped.push({
                id: typeof item.id === "string" ? item.id : "",
                reason: typeof item.reason === "string" ? item.reason : ""
              });
            }
          }
          return skipped;
        };
        var parseIncoming = (raw) => {
          if (!isRecord(raw)) return null;
          if (raw.type === "selection-updated") {
            return {
              type: "selection-updated",
              layers: toLayers(raw.layers),
              autoLayoutIds: toStringArray(raw.autoLayoutIds),
              nonMovableIds: toStringArray(raw.nonMovableIds),
              sameParent: raw.sameParent === true
            };
          }
          if (raw.type === "align-result" || raw.type === "distribute-result") {
            return {
              type: raw.type,
              moved: typeof raw.moved === "number" ? raw.moved : 0,
              skipped: toSkipped(raw.skipped),
              warning: typeof raw.warning === "string" ? raw.warning : void 0
            };
          }
          if (raw.type === "align-error") {
            return {
              type: "align-error",
              message: typeof raw.message === "string" ? raw.message : ""
            };
          }
          return null;
        };
        window.onmessage = (event) => {
          const data = event.data;
          const message = isRecord(data) ? parseIncoming(data.pluginMessage) : null;
          if (!message) return;
          if (message.type === "selection-updated") {
            const lostKeyObject = state.keyObjectId !== null && !message.layers.some((layer) => layer.id === state.keyObjectId);
            state.layers = message.layers;
            state.autoLayoutIds = message.autoLayoutIds;
            state.nonMovableIds = message.nonMovableIds;
            state.sameParent = message.sameParent;
            if (lostKeyObject) {
              state.keyObjectId = null;
            }
            setStatus("");
            setSpacingError("");
            if (lostKeyObject) {
              setWarning(
                "The key object is no longer in the selection. Please choose a new one."
              );
            } else {
              setWarning("");
            }
            render();
            return;
          }
          if (message.type === "align-result") {
            renderResult(
              message,
              (moved) => `Aligned ${moved} layer(s).`,
              "Already aligned.",
              false
            );
            return;
          }
          if (message.type === "distribute-result") {
            renderResult(
              message,
              (moved) => `Distributed ${moved} layer(s).`,
              "Already distributed.",
              true
            );
            return;
          }
          setStatus("");
          setWarning(message.message || "Alignment failed.");
        };
        render();
        postToMain({ type: "ui-ready" });
      })();
    </script>
  </body>
</html>
